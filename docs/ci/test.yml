name: test
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f" || exit 1; done
      - name: Tests
        run: npm test
